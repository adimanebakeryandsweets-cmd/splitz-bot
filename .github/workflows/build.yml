name: Build Master APK
on:
  push:
    branches: [master-app]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish APK to the apk branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/SplitzblrMaster.apk
          git config user.name "build"; git config user.email "build@users.noreply.github.com"
          git checkout --orphan apkbuild
          git rm -rf . >/dev/null
          cp /tmp/SplitzblrMaster.apk .
          git add SplitzblrMaster.apk
          git commit -m "APK build"
          git push -f origin HEAD:master-app-apk
