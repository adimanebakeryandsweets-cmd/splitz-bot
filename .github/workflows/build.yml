name: Build Customer APK
on:
  push:
    branches: [customer-app]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: gradle assembleDebug bundleRelease --no-daemon --stacktrace
      - name: Publish APK to the apk branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/SplitzblrCustomer.apk
          cp app/build/outputs/bundle/release/app-release.aab /tmp/SplitzblrCustomer-unsigned.aab
          git config user.name "build"; git config user.email "build@users.noreply.github.com"
          git checkout --orphan apkbuild
          git rm -rf . >/dev/null
          cp /tmp/SplitzblrCustomer.apk .
          cp /tmp/SplitzblrCustomer-unsigned.aab . 
          git add -A
          git commit -m "APK build"
          git push -f origin HEAD:customer-app-apk
